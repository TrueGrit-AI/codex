name: Fork desktop compatibility build

on:
  push:
    branches: [build/desktop-guardian-compat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      STABLE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-apple-darwin
      - name: Test Guardian configuration compatibility and validation
        working-directory: codex-rs
        run: cargo test --locked --profile dev-small -p codex-features guardian_v2
      - name: Build native fork and runtime helpers
        working-directory: codex-rs
        run: >-
          cargo build --locked --profile dev-small --target x86_64-apple-darwin
          --bin codex --bin codex-code-mode-host --bin codex-responses-api-proxy
      - name: Exercise structured Guardian config through thread creation
        run: >-
          python3 scripts/fork-desktop-smoke.py
          --codex codex-rs/target/x86_64-apple-darwin/dev-small/codex
      - name: Package binaries with source and checksum provenance
        run: |
          mkdir -p dist/package/bin
          for binary in codex codex-code-mode-host codex-responses-api-proxy; do
            cp "codex-rs/target/x86_64-apple-darwin/dev-small/$binary" "dist/package/bin/$binary"
            codesign --force --sign - "dist/package/bin/$binary"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          root = Path('dist/package')
          manifest = {
              'revision': os.environ['GITHUB_SHA'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'target': 'x86_64-apple-darwin',
              'profile': 'dev-small',
              'compiler': subprocess.check_output(['rustc', '--version'], text=True).strip(),
              'files': {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in sorted((root / 'bin').iterdir())},
          }
          (root / 'build-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          tar -czf dist/codex-fork-x86_64-apple-darwin.tar.gz -C dist/package bin build-manifest.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: codex-fork-x86_64-apple-darwin
          path: dist/codex-fork-x86_64-apple-darwin.tar.gz
          if-no-files-found: error
          retention-days: 14
